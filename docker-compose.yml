services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: citypulse
    ports:
      - "5432:5432"
    volumes:
      - citypulse-db-data:/var/lib/postgresql/data

  bus-collector:
    build: .
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres

volumes:
  citypulse-db-data:
