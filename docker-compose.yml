services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: citypulse
    ports:
      - "5432:5432"
    volumes:
      - citypulse-db-data:/var/lib/postgresql/data

  bus-collector:
    build: .
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    restart: unless-stopped
    command: ["python", "-u", "src/collectors/bus.py"]

  weather-collector:
    build: .
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    restart: unless-stopped
    command: ["python", "-u", "src/collectors/weather.py"]

  traffic-collector:
    build: .
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    restart: unless-stopped
    command: ["python", "-u", "src/collectors/traffic.py"]

  air-collector:
    build: .
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    restart: unless-stopped
    command: ["python", "-u", "src/collectors/air_quality.py"]

  api:
    build: .
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "8000:8000"
    restart: unless-stopped
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  citypulse-db-data:
